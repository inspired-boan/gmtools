[package]
name = "gmtools"
version = "0.1.0"
description = "TRPG 跑团 GM 工具"
edition = "2021"

# lib 供 tauri build 钩子与移动端复用，bin 是桌面入口
[lib]
name = "gmtools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
strip = true
